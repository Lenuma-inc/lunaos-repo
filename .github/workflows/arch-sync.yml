name: Arch Linux Mirror Sync

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

concurrency:
  group: archlinux-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    container:
      image: archlinux:base-devel
      volumes:
        - /usr:/usr-host
        - /opt:/opt-host
      options: --privileged

    env:
      BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.FTP_USERNAME }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare Arch Linux container
        run: |
          pacman -Syuu --noconfirm --disable-download-timeout --needed \
            curl lftp python aws-cli
          pacman-key --init
          pacman -S --noconfirm archlinux-keyring || true
          rm -rf /var/cache/pacman/pkg/download-*
          yes | pacman -Scc
          useradd -m user -G wheel && echo "user ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown user -R /tmp
          chown user -R ..

      - name: Run Arch Linux mirror sync
        run: |
          chmod +x ./sync-archlinux.sh
          python -m unittest test_sync_archlinux.py -v
          ./sync-archlinux.sh
