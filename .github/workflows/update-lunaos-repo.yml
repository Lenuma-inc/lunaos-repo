name: LunaOS Repo Update
on:
  schedule:
    - cron: "11 */2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-lunaos-repo.yml"
      - "buildbot.py"
      - "buildbot_runtime.py"
      - "prepare-container.sh"
      - "publish-repo.sh"
      - "upload-repo.sh"
      - "packages.tsv"
      - "makepkg.conf"
      - "sign.sh"
      - "update-repo.sh"
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild every package
        type: boolean
        default: false
      packages:
        description: Comma-separated package directories
        type: string
        required: false

concurrency:
  group: lunaos-repo-update
  cancel-in-progress: false

jobs:
  macOS:
    runs-on: macos-14
    steps:

      - name: Rename and tar firmware
        run: |
          curl --fail --show-error --location --retry 3 https://raw.githubusercontent.com/t2linux/wiki/9314a44971df3d6aff9af96b023181fb3e40ad2b/docs/tools/firmware.sh > firmware.sh
          python3 firmware.sh /usr/share/firmware ${{ github.workspace }}/firmware.tar -v
          mkdir firmware
          mv ./firmware.tar ./firmware

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: ${{ github.workspace }}/firmware

  build:
    needs: [macOS]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash --noprofile --norc -e -o pipefail {0}

    permissions:
      contents: write
      actions: write
      issues: write

    container:
      image: archlinux:base-devel
      volumes:
        - /usr:/usr-host
        - /opt:/opt-host
      options: --privileged

    env:
      PKGDEST: "/tmp/lunaos-repo"
      repo: "lunaos-repo"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PYTHONUNBUFFERED: "1"
      BUILDBOT_COMMAND_TIMEOUT: "600"
      BUILDBOT_BUILD_TIMEOUT: "7200"
      BUILDBOT_RUN_TIMEOUT: "14400"
      BUILDBOT_ISSUES: ${{ vars.BUILDBOT_ISSUES || 'false' }}
      BUILDBOT_ARCH_ISSUES: ${{ vars.BUILDBOT_ARCH_ISSUES || 'false' }}
      BUILDBOT_REBUILD_DEPS: ${{ vars.BUILDBOT_REBUILD_DEPS || 'python' }}
      BUILDBOT_FULL: ${{ github.event.inputs.full || 'false' }}
      BUILDBOT_PACKAGES: ${{ github.event.inputs.packages || '' }}
      BUILDBOT_STATE: ${{ github.workspace }}/.build-state/state.json
      BUILDBOT_LOGDIR: ${{ github.workspace }}/build-logs

    steps:
      - name: Checkout buildbot
        uses: actions/checkout@v7

      - name: Initialize diagnostics
        run: |
          mkdir -p "$BUILDBOT_LOGDIR"
          { date -u; uname -a; df -h; free -h; } | tee "$BUILDBOT_LOGDIR/environment.log"

      - name: Restore package state
        uses: actions/cache/restore@v5
        with:
          path: .build-state
          key: lunaos-package-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lunaos-package-state-v2-

      - name: Prepare container
        timeout-minutes: 30
        run: bash "$GITHUB_WORKSPACE/prepare-container.sh" 2>&1 | tee "$BUILDBOT_LOGDIR/prepare.log"

      - name: Import GPG private key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          trust_level: 5

      - name: Maximize build space
        run: |
          echo "==> Available space before cleanup"
          echo
          df -h
          rm -rf /usr-host/share/dotnet
          rm -rf /usr-host/share/swift
          rm -rf /usr-host/share/java
          rm -rf /usr-host/local/lib/android
          rm -rf /opt-host/ghc
          rm -rf /opt-host/hostedtoolcache
          rm -rf /opt-host/az
          echo "==> Available space after cleanup"
          echo
          df -h

      - name: Download T2 firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: /tmp/lunaos-input

      - name: Build changed packages and dependents
        id: buildbot
        run: python3 "$GITHUB_WORKSPACE/buildbot.py"

      - name: Sign lunaos repo
        if: steps.buildbot.outputs.fatal == '0' && steps.buildbot.outputs.packages_built != '0'
        env:
          GPG_PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: sh "$GITHUB_WORKSPACE/sign.sh" 2>&1 | tee "$BUILDBOT_LOGDIR/sign.log"

      - name: Update lunaos repo database
        if: steps.buildbot.outputs.fatal == '0' && steps.buildbot.outputs.packages_built != '0'
        env:
          GPG_PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: sh "$GITHUB_WORKSPACE/update-repo.sh" 2>&1 | tee "$BUILDBOT_LOGDIR/database.log"

      - name: Publish repository release
        if: steps.buildbot.outputs.fatal == '0' && steps.buildbot.outputs.packages_built != '0'
        timeout-minutes: 30
        run: bash "$GITHUB_WORKSPACE/publish-repo.sh" 2>&1 | tee "$BUILDBOT_LOGDIR/publish.log"

      - name: Upload repository to S3
        timeout-minutes: 30
        if: steps.buildbot.outputs.fatal == '0' && steps.buildbot.outputs.packages_built != '0'
        env:
          FTP_SERVER: ftp.ru1.storage.beget.cloud
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          LOCAL_DIR: ${{ env.PKGDEST }}/
          SERVER_DIR: ${{ secrets.S3_BUCKET_NAME }}/lunaos-repo/
        run: bash "$GITHUB_WORKSPACE/upload-repo.sh" 2>&1 | tee "$BUILDBOT_LOGDIR/upload.log"

      - name: Save package state
        if: success() && steps.buildbot.outputs.fatal == '0' && hashFiles('.build-state/state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .build-state
          key: lunaos-package-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Final diagnostics
        if: always()
        run: |
          mkdir -p "$BUILDBOT_LOGDIR"
          { date -u; df -h; free -h; ps -eo pid,ppid,comm,etime; } > "$BUILDBOT_LOGDIR/final-environment.log"

      - name: Upload build logs and state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lunaos-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-logs/
            .build-state/state.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail run when packages failed
        if: always() && (steps.buildbot.outcome == 'failure' || (steps.buildbot.outputs.failed != '' && steps.buildbot.outputs.failed != '0'))
        run: exit 1
